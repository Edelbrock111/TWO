<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бажання на двох</title>
<style>
:root{--bg:#fff7f5;--card:#fff;--tx:#2b2226;--mut:#85727a;--ac:#e0456b;--ac2:#fde3ea;--ok:#2e9e6b;--bd:#f1d9df;--m:#3b82f6;--f:#e0456b}
@media (prefers-color-scheme:dark){:root{--bg:#1c1518;--card:#2a2024;--tx:#f5e9ed;--mut:#b49aa4;--ac:#ff6f94;--ac2:#4a2733;--ok:#52c48e;--bd:#3d2c33;--m:#6ea8ff;--f:#ff6f94;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:14px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:9px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:13px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}.card h2{font-size:16px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.cnt,.tag{color:var(--mut);font-weight:400;font-size:13px}.tag{white-space:nowrap}
.w{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}.w.sel{background:var(--ac2);border-radius:8px;padding-left:6px}
.w .t{flex:1;word-break:break-word}.w.d .t{text-decoration:line-through;color:var(--mut)}
button.s{border:0;border-radius:10px;padding:7px 10px;font-size:13px;background:var(--ac2);color:var(--ac)}button.ok{background:var(--ok);color:#fff}
button.p{border:0;border-radius:12px;padding:11px 14px;background:var(--ac);color:#fff;font-size:15px}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}input{flex:1;min-width:0;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:8px}
.empty{color:var(--mut);font-size:14px}.err{color:var(--ac);font-size:14px;min-height:18px}.sym{font-weight:700}.sym.m{color:var(--m)}.sym.f{color:var(--f)}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// === ВСТАВ СВОЇ ДАНІ (Supabase -> Project Settings -> API). Лише "anon public" ключ, НІКОЛИ не service_role! ===
const SUPABASE_URL = "https://gzalpvimuhpapwrszyor.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pp1-QF11m-qKJXGGzE6yEQ_PkdOVl7q";
// ====================================================================================================
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const R = { m: { name: 'Партнер', sym: '♂' }, f: { name: 'Партнерка', sym: '♀' } }, N = 3;
const other = r => r === 'm' ? 'f' : 'm';
const cur = new Date().toLocaleString('sv-SE', { timeZone: 'Europe/Kyiv' }).slice(0, 7);
const fmt = s => new Date(s).toLocaleString('uk-UA', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
let me = null, wishes = [], picks = {}, tab = 'common', selMode = false, sel = new Set(), msg = '', loginMsg = '';
const $app = document.getElementById('app');
function el(t, p, ...k) { const e = document.createElement(t); for (const a in (p || {})) { if (a === 'class') e.className = p[a]; else if (a.startsWith('on')) e.addEventListener(a.slice(2), p[a]); else e[a] = p[a]; } k.flat().forEach(c => e.append(c)); return e; }
const badge = r => el('span', { class: 'sym ' + r, textContent: R[r].sym + ' ' + R[r].name });
const pickOf = r => picks[r], ids = r => (picks[r] ? picks[r].ids : []);
const monthW = r => ids(r).map(i => wishes.find(w => w.id === i)).filter(Boolean);
const inMonth = w => ids(w.by_role).includes(w.id);
const err = t => { msg = t; render(); };

async function load() {
  const a = await db.from('wishes').select('*').order('created_at');
  const b = await db.from('picks').select('*').eq('month', cur);
  if (a.error || b.error) return err('Помилка завантаження: ' + (a.error || b.error).message);
  wishes = a.data; picks = {}; b.data.forEach(p => picks[p.for_role] = p); render();
}
async function act(p) { const { error } = await p; msg = error ? (error.code === '23505' ? 'Таке бажання вже є (або вже виконане) 🙂' : error.message) : ''; await load(); }
const addWish = t => { t = t.trim(); if (t) act(db.from('wishes').insert({ text: t, by_role: me })); };
const doPick = manual => { selMode = false; const m = [...sel]; sel.clear(); act(db.rpc('make_pick', { manual: manual ? m : [] })); };

function listView(r) {
  const out = [];
  if (r === me) {
    const inp = el('input', { placeholder: 'Нове бажання…', maxLength: 200 });
    const go = () => { const v = inp.value; inp.value = ''; addWish(v); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    out.push(el('div', { class: 'card' }, el('div', { class: 'row' }, inp, el('button', { class: 'p', textContent: 'Додати', onclick: go }))));
  } else if (!pickOf(r)) {
    const avail = wishes.filter(w => w.by_role === r && !w.done).length;
    const c = el('div', { class: 'card' }, el('h2', { textContent: 'Що ти зробиш цього місяця?' }));
    if (avail < N) c.append(el('div', { class: 'empty', textContent: 'Потрібно щонайменше ' + N + ' невиконаних бажань (зараз ' + avail + ').' }));
    else if (!selMode) c.append(el('div', { class: 'sub', textContent: 'Один раз на місяць: усі ' + N + ' випадково, або ' + (N - 1) + ' сам(а) + 1 випадково.' }),
      el('div', { class: 'row' }, el('button', { class: 'p', textContent: '🎲 Усі ' + N + ' випадково', onclick: () => doPick(false) }), el('button', { class: 's', textContent: 'Обрати ' + (N - 1) + ' самому(й)', onclick: () => { selMode = true; sel.clear(); render(); } })));
    else c.append(el('div', { class: 'sub', textContent: 'Познач ' + (N - 1) + ' бажання: ' + sel.size + '/' + (N - 1) }),
      el('div', { class: 'row' }, el('button', { class: 'p', textContent: 'Підтвердити', disabled: sel.size !== N - 1, onclick: () => doPick(true) }), el('button', { class: 's', textContent: 'Скасувати', onclick: () => { selMode = false; sel.clear(); render(); } })));
    out.push(c);
  }
  out.push(el('div', { class: 'err', textContent: msg }));
  const list = wishes.filter(w => w.by_role === r);
  const card = el('div', { class: 'card' }, el('h2', {}, badge(r), el('span', { class: 'cnt', textContent: list.length })));
  if (!list.length) card.append(el('div', { class: 'empty', textContent: 'Порожньо.' }));
  list.forEach(w => {
    const row = el('div', { class: 'w' + (w.done ? ' d' : '') + (sel.has(w.id) ? ' sel' : '') }, el('span', { class: 't', textContent: w.text }),
      w.done ? el('span', { class: 'tag', textContent: '✓ виконано' }) : inMonth(w) ? el('span', { class: 'tag', textContent: '📌 цього місяця' }) : '');
    if (selMode && r !== me && !w.done) row.addEventListener('click', () => { if (sel.has(w.id)) sel.delete(w.id); else if (sel.size < N - 1) sel.add(w.id); render(); });
    if (r === me && !w.done && !inMonth(w)) row.append(el('button', { class: 's', textContent: '✕', onclick: () => confirm('Видалити це бажання?') && act(db.from('wishes').delete().eq('id', w.id)) }));
    card.append(row);
  });
  return [...out, card];
}
function commonView() {
  const out = [el('div', { class: 'sub', textContent: cur + ': по ' + N + ' бажання для кожного. «Зроблено» відмічає той, для кого це зробили.' }), el('div', { class: 'err', textContent: msg })];
  ['m', 'f'].forEach(r => {
    const p = pickOf(r), list = monthW(r);
    const c = el('div', { class: 'card' }, el('h2', {}, badge(r), el('span', { class: 'cnt', textContent: list.filter(w => w.done).length + '/' + (p ? p.ids.length : N) })),
      el('div', { class: 'sub' }, p ? ['Обрав(ла): ', badge(p.picker), p.mode === 'random' ? ' (випадково)' : ''] : 'Ще не обрано — це робить ' + R[other(r)].name + ' ' + R[other(r)].sym));
    list.forEach(w => c.append(el('div', { class: 'w' + (w.done ? ' d' : '') }, el('span', { class: 't', textContent: (w.done ? '✅ ' : '⬜ ') + w.text }),
      w.done ? el('span', { class: 'tag', textContent: fmt(w.done_at) }) : r === me ? el('button', { class: 's ok', textContent: '✓ Зроблено', onclick: () => act(db.rpc('mark_done', { wid: w.id })) }) : '')));
    out.push(c);
  });
  return out;
}
function logView() {
  const d = wishes.filter(w => w.done).sort((a, b) => b.done_at.localeCompare(a.done_at)), c = r => d.filter(w => w.by_role === r).length;
  const card = el('div', { class: 'card' }, el('h2', {}, el('span', { textContent: 'Журнал виконаного 💛' }), el('span', { class: 'cnt', textContent: 'усього ' + d.length })),
    el('div', { class: 'sub' }, badge('m'), ' отримав: ' + c('m') + ' · ', badge('f'), ' отримала: ' + c('f')));
  if (!d.length) card.append(el('div', { class: 'empty', textContent: 'Тут з’являтимуться виконані бажання з часом відмітки.' }));
  d.forEach(w => card.append(el('div', { class: 'w' }, badge(w.by_role), el('span', { class: 't', textContent: w.text }), el('span', { class: 'tag', textContent: fmt(w.done_at) }))));
  return [card];
}
function loginView() {
  const em = el('input', { type: 'email', placeholder: 'Email', autocomplete: 'username' }), pw = el('input', { type: 'password', placeholder: 'Пароль', autocomplete: 'current-password' });
  const go = async () => { const { error } = await db.auth.signInWithPassword({ email: em.value.trim(), password: pw.value }); if (error) { loginMsg = 'Невірний email або пароль'; render(); } else start(); };
  pw.addEventListener('keydown', e => e.key === 'Enter' && go());
  $app.replaceChildren(el('h1', { textContent: 'Бажання на двох 💞' }), el('div', { class: 'sub', textContent: 'Вхід лише для вас двох' }), em, pw, el('button', { class: 'p', textContent: 'Увійти', onclick: go }), el('div', { class: 'err', textContent: loginMsg }));
}
function render() {
  if (!me) return loginView();
  const T = [['common', 'Спільне'], ['m', R.m.sym + ' Партнер'], ['f', R.f.sym + ' Партнерка'], ['log', 'Журнал']];
  const tabs = el('div', { class: 'tabs' }, T.map(([k, t]) => el('button', { class: tab === k ? 'on' : '', textContent: t, onclick: () => { tab = k; msg = ''; selMode = false; sel.clear(); render(); } })));
  const body = tab === 'common' ? commonView() : tab === 'log' ? logView() : listView(tab);
  $app.replaceChildren(el('h1', { textContent: 'Бажання на двох 💞' }), el('div', { class: 'sub' }, 'Ти: ', badge(me), ' ', el('button', { class: 's', textContent: '↻', onclick: load }), ' ', el('button', { class: 's', textContent: 'вийти', onclick: async () => { await db.auth.signOut(); me = null; render(); } })), tabs, ...body);
}
async function start() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return render();
  const { data } = await db.from('members').select('role').maybeSingle();
  if (!data) { loginMsg = 'Цей акаунт не має доступу.'; await db.auth.signOut(); return render(); }
  me = data.role; await load();
}
start(); setInterval(() => { if (me && !document.hidden && !selMode) load(); }, 20000);
</script></body></html>
